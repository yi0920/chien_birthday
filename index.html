<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>臺灣捷運轉盤 Demo</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f2ea;
      --ink: #251f18;
      --muted: #6d6256;
      --panel: #fffaf2;
      --line: #d7cfc3;
      --accent: #006b5f;
      --accent-ink: #ffffff;
      --accent2: #b6472f;
      --accent2-ink: #ffffff;
      --accent3: #2f6fbd;
      --accent3-ink: #ffffff;
      --red: #d74838;
      --yellow: #f5b84b;
      --blue: #2f6fbd;
      --green: #3f8f5f;
      --orange: #d66b2d;
      --purple: #7755a6;
      --shadow: 0 18px 45px rgb(66 47 21 / 16%);
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171819;
        --ink: #f4eee5;
        --muted: #bfb4a8;
        --panel: #242525;
        --line: #45413a;
        --shadow: 0 18px 45px rgb(0 0 0 / 32%);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background:
        linear-gradient(135deg, rgb(0 107 95 / 10%), transparent 38%),
        linear-gradient(315deg, rgb(215 72 56 / 10%), transparent 42%),
        var(--bg);
      color: var(--ink);
    }

    main {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 26px 0 34px;
    }

    .section-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 40px 0 18px;
    }

    .section-divider::before,
    .section-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .section-title {
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 420px);
      gap: 22px;
      align-items: center;
    }

    .wheel-wrap {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 420px;
      padding: 18px;
    }

    canvas {
      width: min(82vw, 590px);
      max-width: 100%;
      aspect-ratio: 1;
      filter: drop-shadow(var(--shadow));
    }

    .pointer {
      position: absolute;
      top: 12px;
      left: 50%;
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 38px solid var(--red);
      transform: translateX(-50%);
      filter: drop-shadow(0 5px 7px rgb(0 0 0 / 20%));
      z-index: 2;
    }

    .pointer.pointer-alt {
      border-top-color: var(--accent2);
    }

    .pointer.pointer-alt2 {
      border-top-color: var(--accent3);
    }

    .hub {
      position: absolute;
      display: grid;
      place-items: center;
      width: clamp(92px, 17vw, 126px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 8px solid var(--panel);
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      box-shadow: 0 10px 24px rgb(0 0 0 / 22%);
      pointer-events: none;
    }

    .hub.hub-alt {
      background: var(--accent2);
      color: var(--accent2-ink);
    }

    .hub.hub-alt2 {
      background: var(--accent3);
      color: var(--accent3-ink);
    }

    .panel {
      background: color-mix(in srgb, var(--panel), transparent 4%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 50px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    h1.h1-alt {
      color: var(--accent2);
    }

    h1.h1-alt2 {
      color: var(--accent3);
    }

    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .result {
      display: grid;
      gap: 6px;
      margin: 18px 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--bg), var(--panel) 65%);
    }

    .label {
      color: var(--muted);
      font-size: 14px;
    }

    .station {
      min-height: 42px;
      font-size: clamp(25px, 7vw, 42px);
      font-weight: 700;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .meta {
      color: var(--muted);
      min-height: 1.4em;
    }

    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgb(0 107 95 / 22%);
    }

    button.button-alt {
      background: var(--accent2);
      box-shadow: 0 8px 18px rgb(182 71 47 / 22%);
    }

    button.button-alt2 {
      background: var(--accent3);
      box-shadow: 0 8px 18px rgb(47 111 189 / 22%);
    }

    button:disabled {
      cursor: wait;
      opacity: .72;
    }

    .button-ghost {
      min-height: 38px;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: none;
      font-weight: 600;
      font-size: 13px;
    }

    .stat:has(.button-ghost) {
      display: grid;
      align-items: end;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .stat {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    .stat strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
    }

    details {
      margin-top: 16px;
    }

    summary {
      cursor: pointer;
      color: var(--muted);
    }

    .list {
      margin-top: 10px;
      max-height: 190px;
      overflow: auto;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      .wheel-wrap {
        min-height: auto;
        padding: 8px 0 0;
      }

      .pointer {
        top: 0;
      }

      .panel {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="app">
      <section class="wheel-wrap" aria-label="臺灣捷運目的地轉盤">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel-station" width="900" height="900"></canvas>
        <div class="hub">SPIN</div>
      </section>

      <section class="panel">
        <h1>捷運去哪裡</h1>
        <p class="sub">抽到哪一站就出發。</p>

        <button id="spinButton-station" type="button">開始轉盤</button>

        <div class="result" aria-live="polite">
          <span class="label">目的地</span>
          <div class="station" id="result-station">尚未開轉</div>
          <div class="meta" id="resultMeta-station">按下按鈕決定今天要去哪。</div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="label">站名池</span>
            <strong id="stationCount-station">0</strong>
          </div>
          <div class="stat">
            <span class="label">目前時間</span>
            <strong id="clock-station">--:--</strong>
          </div>
          <div class="stat">
            <span class="label"></span>
            <button id="resetButton-station" class="button-ghost" type="button">重置已抽紀錄</button>
          </div>
        </div>

        <details>
          <summary>查看內建站名</summary>
          <div class="list" id="stationList-station"></div>
        </details>
      </section>
    </div>

    <div class="section-divider">
      <span class="section-title">轉盤 2：到站後要做什麼</span>
    </div>

    <div class="app">
      <section class="wheel-wrap" aria-label="到站後行程轉盤">
        <div class="pointer pointer-alt" aria-hidden="true"></div>
        <canvas id="wheel-activity" width="900" height="900"></canvas>
        <div class="hub hub-alt">SPIN</div>
      </section>

      <section class="panel">
        <h1 class="h1-alt">到站要幹嘛</h1>
        <p class="sub">出站之後，讓轉盤決定你要做什麼，抽過的選項不會再重複，直到抽完一輪才重新開始。</p>

        <button id="spinButton-activity" class="button-alt" type="button">開始轉盤</button>

        <div class="result" aria-live="polite">
          <span class="label">行程</span>
          <div class="station" id="result-activity">尚未開轉</div>
          <div class="meta" id="resultMeta-activity">按下按鈕決定到站後要做什麼。</div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="label">選項池</span>
            <strong id="stationCount-activity">0</strong>
          </div>
          <div class="stat">
            <span class="label">目前時間</span>
            <strong id="clock-activity">--:--</strong>
          </div>
          <div class="stat">
            <span class="label"></span>
            <button id="resetButton-activity" class="button-ghost" type="button">重置已抽紀錄</button>
          </div>
        </div>

        <details>
          <summary>查看內建選項</summary>
          <div class="list" id="stationList-activity"></div>
        </details>
      </section>
    </div>

    <div class="section-divider">
      <span class="section-title">轉盤 3：送禮對象</span>
    </div>

    <div class="app">
      <section class="wheel-wrap" aria-label="送禮對象轉盤">
        <div class="pointer pointer-alt2" aria-hidden="true"></div>
        <canvas id="wheel-gift" width="900" height="900"></canvas>
        <div class="hub hub-alt2">SPIN</div>
      </section>

      <section class="panel">
        <h1 class="h1-alt2">送禮給誰</h1>
        <p class="sub">轉到誰就送誰，抽過的人會從轉盤上移除機會，直到全部抽完可以按重置再抽一輪。</p>

        <button id="spinButton-gift" class="button-alt2" type="button">開始轉盤</button>

        <div class="result" aria-live="polite">
          <span class="label">送禮對象</span>
          <div class="station" id="result-gift">尚未開轉</div>
          <div class="meta" id="resultMeta-gift">按下按鈕決定要送誰。</div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="label">名單人數</span>
            <strong id="stationCount-gift">0</strong>
          </div>
          <div class="stat" style="grid-column: 1 / -1;">
            <button id="resetButton-gift" class="button-ghost" type="button">重置已抽紀錄</button>
          </div>
        </div>

        <details>
          <summary>查看名單</summary>
          <div class="list" id="stationList-gift"></div>
        </details>
      </section>
    </div>
  </main>

  <script>
    // ---------- 資料來源 ----------
    const systems = [
      {
        name: "臺北捷運",
        stations: [
          "六張犁", "科技大樓", "大安","忠孝復興", "南京復興", "中山國中", "松山機場", "大直" , "臺北南港展覽館",
          "圓山", "民權西路", "雙連", "中山", "臺北車站", "臺大醫院", "中正紀念堂",  "大安森林公園", "信義安和", "臺北101/世貿", "象山",
          "台北小巨蛋",  "松江南京", "北門", "西門", "小南門", "古亭", "台電大樓", "公館",
          "東門", "行天宮", "中山國小", "大橋頭", "善導寺", "忠孝新生", "忠孝敦化", "國父紀念館", "市政府",
          "永春", "後山埤", "昆陽", "南港"
        ]
      }
    ];

    const stationItems = systems.flatMap((system) =>
      system.stations.map((station) => ({ label: station, group: system.name }))
    );

    const activityGroups = [
      {
        name: "吃吃喝喝",
        items: [
          "吃義大利麵", "吃火鍋", "吃燒烤", "吃拉麵", "吃韓式", "吃泰式", "喝手搖飲", "吃甜點", "逛小吃", "吃冰" , "找一家 Google 4.8⭐以上" 
        ]
      },
      {
        name: "閒晃放空",
        items: [
          "逛寶雅" , "去公園走走", "逛百貨公司", "去書店晃晃", "買衣服",  "逛唱片行", "幫對方穿搭"
        ]
      },
      {
        name: "交換驚喜",
        items: [
          "每人挑一樣零食分享" , "轉一顆扭蛋給對方" , "買一杯飲料給對方" , "買神秘禮物給壽星" , "找一間多拿滋每人挑一樣送對方" , "去超商每人挑一種酒送對方"
        ]
      },
      {
        name: "娛樂活動",
        items: [
          "拍個reels", "拍拍貼機", "打卡熱門景點"
        ]
      }
    ];

    const activityItems = activityGroups.flatMap((group) =>
      group.items.map((item) => ({ label: item, group: group.name }))
    );

    // 這些選項只會「出現在轉盤上」充版面，但實際上永遠不會被抽中（魚目混珠）。
    // 把你想要排除的項目名稱填進這個陣列即可，要跟上面選項的文字完全一樣。
    const ACTIVITY_DECOY_LABELS = [
         "吃泰式" , "吃火鍋", "吃燒烤", "吃拉麵", "吃韓式", "逛小吃"
    ];

    // 送禮對象名單。先放範例名字，請自行替換成你要的人名（一個字串一個人）。
    const giftGroups = [
      {
        name: "送禮名單",
        items: [
          "芊", "凱", "恆", "丞", "婷", "沁", "燊"
        ]
      }
    ];

    const giftItems = giftGroups.flatMap((group) =>
      group.items.map((item) => ({ label: item, group: group.name }))
    );

    // ---------- 共用轉盤引擎 ----------
    const colors = ["#d74838", "#f5b84b", "#3f8f5f", "#2f6fbd", "#7755a6", "#d66b2d"];

    function normalizeAngle(angle) {
      const full = Math.PI * 2;
      return ((angle % full) + full) % full;
    }

    function isForcedTime(config) {
      if (!config.LOCK_ENABLED) return false;

      const [hourText, minuteText = "0"] = config.LOCK_AFTER_TIME.split(":");
      const lockHour = Number(hourText);
      const lockMinute = Number(minuteText);
      const now = new Date();

      if (!Number.isFinite(lockHour) || !Number.isFinite(lockMinute)) return false;
      return now.getHours() * 60 + now.getMinutes() >= lockHour * 60 + lockMinute;
    }

    function createWheel(opts) {
      // opts: {
      //   items, config: {LOCK_ENABLED, LOCK_AFTER_TIME, LOCK_LABEL},
      //   noRepeat: boolean            -> 抽過的項目 (依 label) 不會再被抽到，直到全部抽完自動重置
      //   excludeLabels: string[]      -> 這些項目只會出現在轉盤上，但永遠不會被實際抽中（魚目混珠）
      //   canvasId, spinButtonId, resultId, resultMetaId, countId, clockId, listId, listBuilder,
      //   remainingId, resetButtonId   -> (noRepeat 模式用) 顯示剩餘數量與重置按鈕
      // }
      const {
        items, config,
        noRepeat = false,
        excludeLabels = [],
        canvasId, spinButtonId, resultId, resultMetaId,
        countId, clockId, listId, listBuilder,
        remainingId, resetButtonId
      } = opts;

      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");
      const spinButton = document.getElementById(spinButtonId);
      const result = document.getElementById(resultId);
      const resultMeta = document.getElementById(resultMetaId);
      const countEl = document.getElementById(countId);
      const clockEl = clockId ? document.getElementById(clockId) : null;
      const listEl = document.getElementById(listId);
      const remainingEl = remainingId ? document.getElementById(remainingId) : null;
      const resetButton = resetButtonId ? document.getElementById(resetButtonId) : null;

      let rotation = -Math.PI / 2;
      let spinning = false;
      const usedLabels = new Set();

      // 「可以被實際抽到」的完整項目範圍：
      // 排除魚目混珠項目 (excludeLabels)，以及排除有鎖定設定的項目本身
      // (它只能透過強制鎖定時段抽到，平常完全不會進入隨機池)
      function getSelectableUniverse() {
        return items.filter((item) => {
          if (excludeLabels.includes(item.label)) return false;
          if (config.LOCK_ENABLED && config.LOCK_LABEL && item.label === config.LOCK_LABEL) return false;
          return true;
        });
      }

      // 一般隨機抽選池：在可抽範圍之上，若開啟 noRepeat 再排除已經抽過的項目
      function getPool() {
        const universe = getSelectableUniverse();
        if (!noRepeat) return universe;
        return universe.filter((item) => !usedLabels.has(item.label));
      }

      function updateRemaining() {
        if (!remainingEl) return;
        const universe = getSelectableUniverse();
        const remaining = universe.filter((item) => !usedLabels.has(item.label)).length;
        remainingEl.textContent = remaining;
      }

      let justReset = false;

      function pickItem() {
        justReset = false;

        if (isForcedTime(config)) {
          const forced = items.find((item) => item.label === config.LOCK_LABEL);
          if (forced) return forced;
        }

        let pool = getPool();
        if (pool.length === 0 && noRepeat) {
          usedLabels.clear();
          justReset = true;
          pool = getPool();
        }

        return pool[Math.floor(Math.random() * pool.length)];
      }

      function indexForItem(target) {
        return items.findIndex((item) => item.label === target.label && item.group === target.group);
      }

      function drawWheel(activeIndex = -1) {
        const size = canvas.width;
        const center = size / 2;
        const radius = center - 28;
        const slice = (Math.PI * 2) / items.length;
        ctx.clearRect(0, 0, size, size);
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(rotation);

        items.forEach((item, index) => {
          const start = index * slice;
          const end = start + slice;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius, start, end);
          ctx.closePath();
          ctx.fillStyle = index === activeIndex ? "#251f18" : colors[index % colors.length];
          ctx.fill();

          ctx.strokeStyle = "rgba(255, 255, 255, .38)";
          ctx.lineWidth = 1;
          ctx.stroke();

          const labelEvery = Math.max(1, Math.round(items.length / 16));
          if (index % labelEvery === 0) {
            ctx.save();
            ctx.rotate(start + slice / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fffaf2";
            ctx.font = "500 22px Microsoft JhengHei, sans-serif";
            ctx.fillText(item.label, radius - 18, 8);
            ctx.restore();
          }
        });

        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(37, 31, 24, .7)";
        ctx.lineWidth = 12;
        ctx.stroke();
        ctx.restore();
      }

      function spin() {
        if (spinning) return;
        spinning = true;
        spinButton.disabled = true;
        result.textContent = "轉動中...";
        resultMeta.textContent = "命運正在旋轉。";

        const target = pickItem();
        const targetIndex = Math.max(0, indexForItem(target));
        const slice = (Math.PI * 2) / items.length;
        const current = rotation % (Math.PI * 2);
        const pointerAngle = -Math.PI / 2;
        const targetCenter = targetIndex * slice + slice / 2;
        const desired = pointerAngle - targetCenter;
        const fullTurns = 8 + Math.floor(Math.random() * 3);
        const delta = fullTurns * Math.PI * 2 + normalizeAngle(desired - current);
        const start = rotation;
        const finish = start + delta;
        const duration = 1500;
        const startedAt = performance.now();

        function animate(now) {
          const t = Math.min(1, (now - startedAt) / duration);
          const eased = 1 - Math.pow(1 - t, 4);
          rotation = start + (finish - start) * eased;
          drawWheel(targetIndex);
          if (t < 1) {
            requestAnimationFrame(animate);
            return;
          }

          rotation = finish;
          drawWheel(targetIndex);
          result.textContent = target.label;

          if (noRepeat) {
            const wasReset = justReset;
            usedLabels.add(target.label);
            resultMeta.textContent = wasReset
              ? `${target.group} · 已抽完一輪，重新開始`
              : `${target.group} · 本次結果`;
            updateRemaining();
          } else {
            resultMeta.textContent = `${target.group} · 本次結果`;
          }

          spinButton.disabled = false;
          spinning = false;
        }

        requestAnimationFrame(animate);
      }

      function updateClock() {
        if (!clockEl) return;
        const now = new Date();
        clockEl.textContent = now.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" });
      }

      countEl.textContent = items.length;
      listEl.textContent = listBuilder();
      spinButton.addEventListener("click", spin);

      if (resetButton) {
        resetButton.addEventListener("click", () => {
          if (spinning) return;
          usedLabels.clear();
          updateRemaining();
          result.textContent = "尚未開轉";
          resultMeta.textContent = "已重置抽過的紀錄。";
        });
      }

      updateRemaining();
      updateClock();
      if (clockEl) setInterval(updateClock, 1000);
      drawWheel();
    }

    // ---------- 轉盤 1：捷運去哪裡 ----------
    createWheel({
      items: stationItems,
      config: {
        LOCK_ENABLED: true,
        LOCK_AFTER_TIME: "18:00",
        LOCK_LABEL: "國父紀念館"
      },
      noRepeat: true,
      canvasId: "wheel-station",
      spinButtonId: "spinButton-station",
      resultId: "result-station",
      resultMetaId: "resultMeta-station",
      countId: "stationCount-station",
      clockId: "clock-station",
      listId: "stationList-station",
      remainingId: "remainingCount-station",
      resetButtonId: "resetButton-station",
      listBuilder: () =>
        systems.map((system) => `${system.name}: ${system.stations.join("、")}`).join("\n\n")
    });

    // ---------- 轉盤 2：到站要幹嘛（抽過不重複，直到抽完一輪重新開始）----------
    createWheel({
      items: activityItems,
      config: {
        LOCK_ENABLED: true,
        LOCK_AFTER_TIME: "18:00",
        LOCK_LABEL: "吃義大利麵"
      },
      noRepeat: true,
      excludeLabels: ACTIVITY_DECOY_LABELS,
      canvasId: "wheel-activity",
      spinButtonId: "spinButton-activity",
      resultId: "result-activity",
      resultMetaId: "resultMeta-activity",
      countId: "stationCount-activity",
      clockId: "clock-activity",
      listId: "stationList-activity",
      remainingId: "remainingCount-activity",
      resetButtonId: "resetButton-activity",
      listBuilder: () =>
        activityGroups.map((group) => `${group.name}: ${group.items.join("、")}`).join("\n\n")
    });

    // ---------- 轉盤 3：送禮對象（沒有時間鎖定，單純抽過就少一個）----------
    createWheel({
      items: giftItems,
      config: {
        LOCK_ENABLED: false
      },
      noRepeat: true,
      canvasId: "wheel-gift",
      spinButtonId: "spinButton-gift",
      resultId: "result-gift",
      resultMetaId: "resultMeta-gift",
      countId: "stationCount-gift",
      listId: "stationList-gift",
      remainingId: "remainingCount-gift",
      resetButtonId: "resetButton-gift",
      listBuilder: () =>
        giftGroups.map((group) => `${group.name}: ${group.items.join("、")}`).join("\n\n")
    });
  </script>
</body>
</html>
